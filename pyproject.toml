[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-ctl"
version = "0.1.0"
description = "Curate and publish a personal music archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Maciek" }]
dependencies = [
    "rich>=14",
    "rich-argparse>=1.7",
]

[project.scripts]
muse = "muse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
